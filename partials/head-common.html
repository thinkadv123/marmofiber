<!-- Adds the `js` class before first paint so animated elements never flash.
     The timeout is a safety net: if the bundle fails, content still shows. -->
<script>
  document.documentElement.classList.add('js')
  setTimeout(function () {
    if (!document.documentElement.dataset.mfReady) {
      document.documentElement.classList.remove('js')
    }
  }, 4000)
</script>
